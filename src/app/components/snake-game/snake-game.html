<section class="snake-section" aria-labelledby="snake-title">
  <button class="section-close" type="button" (click)="closed.emit()" [attr.aria-label]="i18n.t('backToGames')" [title]="i18n.t('backToGames')">←</button>
  <div class="intro">
    <span>{{ i18n.t('playNow') }}</span><h2 id="snake-title">Neon Snake</h2><p>{{ i18n.t('snakeDesc') }}</p>
    <div class="keyboard-help"><kbd>ARROWS</kbd> / <kbd>WASD</kbd> {{ i18n.t('movement') }} · <kbd>R</kbd> {{ i18n.t('restart') }}</div>
  </div>
  <div class="game-shell">
    <div class="game-stage">
      <div #gameHost class="game-host" aria-label="Gra Snake"></div>
      <button class="audio-toggle" type="button" (click)="toggleAudio()" [attr.aria-label]="i18n.t(audio.enabled() ? 'musicOff' : 'musicOn')" [attr.aria-pressed]="audio.enabled()">{{ audio.enabled() ? '🔊' : '🔇' }}</button>
      <button class="restart-toggle" type="button" (click)="control('restart')" [attr.aria-label]="i18n.t('newGame')" [title]="i18n.t('newGame')">↻</button>
      <div class="touch-controls" aria-label="Sterowanie grą"><button class="up" type="button" (pointerdown)="$event.preventDefault(); control('up')" aria-label="W górę">↑</button><button class="left" type="button" (pointerdown)="$event.preventDefault(); control('left')" aria-label="W lewo">←</button><button class="down" type="button" (pointerdown)="$event.preventDefault(); control('down')" aria-label="W dół">↓</button><button class="right" type="button" (pointerdown)="$event.preventDefault(); control('right')" aria-label="W prawo">→</button><button class="pause" type="button" (click)="control('pause')">{{ paused() ? '▶' : 'Ⅱ' }} {{ i18n.t(paused() ? 'resume' : 'pause') }}</button></div>
    </div>
  </div>
</section>
