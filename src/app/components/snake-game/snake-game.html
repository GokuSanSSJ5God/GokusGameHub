<section class="snake-section" aria-labelledby="snake-title">
  <div class="intro"><span>{{ i18n.t('playNow') }}</span><h2 id="snake-title">Neon Snake</h2><p>{{ i18n.t('snakeDesc') }}</p><div class="keyboard-help"><kbd>ARROWS</kbd> / <kbd>WASD</kbd> {{ i18n.t('movement') }} · <kbd>R</kbd> {{ i18n.t('restart') }}</div><div class="actions"><button class="restart" type="button" (click)="control('restart')">{{ i18n.t('newGame') }}</button><button class="close" type="button" (click)="closed.emit()">{{ i18n.t('backToGames') }}</button></div></div>
  <div class="game-shell"><div class="game-stage"><div #gameHost class="game-host" aria-label="Gra Snake"></div><div class="touch-controls" aria-label="Sterowanie grą"><button class="up" type="button" (pointerdown)="$event.preventDefault(); control('up')" aria-label="W górę">↑</button><button class="left" type="button" (pointerdown)="$event.preventDefault(); control('left')" aria-label="W lewo">←</button><button class="down" type="button" (pointerdown)="$event.preventDefault(); control('down')" aria-label="W dół">↓</button><button class="right" type="button" (pointerdown)="$event.preventDefault(); control('right')" aria-label="W prawo">→</button><button class="pause" type="button" (click)="control('pause')">{{ paused() ? '▶' : 'Ⅱ' }} {{ i18n.t(paused() ? 'resume' : 'pause') }}</button></div></div><div class="mobile-game-actions"><button class="restart" type="button" (click)="control('restart')">{{ i18n.t('newGame') }}</button><button class="close" type="button" (click)="closed.emit()">{{ i18n.t('backToGames') }}</button></div></div>
</section>
