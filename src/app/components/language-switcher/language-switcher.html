<div class="language-switcher" aria-label="Wybierz język">
  <button type="button" [class.active]="i18n.language() === 'pl'" (click)="setLanguage('pl')" title="Polski"><img src="assets/flags/pl.svg" alt="Polski"></button>
  <button type="button" [class.active]="i18n.language() === 'en'" (click)="setLanguage('en')" title="English"><img src="assets/flags/gb.svg" alt="English"></button>
  <button type="button" [class.active]="i18n.language() === 'ja'" (click)="setLanguage('ja')" title="日本語"><img src="assets/flags/jp.svg" alt="日本語"></button>
</div>
