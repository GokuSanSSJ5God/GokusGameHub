<section class="games" id="games" aria-labelledby="games-title">
  <div class="section-heading"><div><span class="eyebrow">{{ i18n.t('trending') }}</span><h2 id="games-title">{{ i18n.t('popular') }}</h2></div><a href="#games">{{ i18n.t('seeAll') }} →</a></div>
  <div class="game-grid">@for (game of games; track game.title) {<article class="game-card"><div class="game-cover" [style.--accent]="game.color"><span aria-hidden="true">{{ game.icon }}</span></div><div class="game-details"><div><p>{{ i18n.t(game.category) }}</p><h3>{{ game.title }}</h3></div><button type="button" [attr.aria-label]="i18n.t('play') + ' ' + game.title">{{ i18n.t('play') }}</button></div></article>}</div>
</section>
