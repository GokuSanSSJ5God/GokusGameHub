<section class="games" id="games" aria-labelledby="games-title">
  <div class="section-heading">
    <div><span class="eyebrow">{{ i18n.t('trending') }}</span><h2 id="games-title">{{ i18n.t('popular') }}</h2></div>
    <a href="#games">{{ i18n.t('seeAll') }} →</a>
  </div>
  <div class="game-grid">
    @for (game of games; track game.id) {
      <article class="game-card" [id]="'game-card-' + game.id" [class.unavailable]="!game.available">
        <div class="game-cover" [style.--accent]="game.color">
          @if (game.cover) { <img [src]="game.cover" [alt]="game.title"> } @else { <span aria-hidden="true">{{ game.icon }}</span> }
        </div>
        <div class="game-details">
          <div><p>{{ i18n.t(game.category) }}</p><h3>{{ game.title }}</h3></div>
          <button type="button" [disabled]="!game.available" (click)="selectGame(game)">{{ game.available ? i18n.t('play') : i18n.t('soon') }}</button>
        </div>
      </article>
    }
  </div>
</section>
