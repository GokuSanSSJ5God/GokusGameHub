<section class="tetris-section" aria-labelledby="tetris-title">
  <div class="intro">
    <span>{{ i18n.t('playNow') }}</span>
    <h2 id="tetris-title">Neon Blocks</h2>
    <p>{{ i18n.t('tetrisDesc') }}</p>
    <div class="keyboard-help"><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> {{ i18n.t('movement') }} · <kbd>↑</kbd> / <kbd>W</kbd> {{ i18n.t('rotation') }} · <kbd>↓</kbd> / <kbd>S</kbd> {{ i18n.t('moveDown') }} · <kbd>SPACE</kbd> {{ i18n.t('drop') }}</div>
    <div class="actions"><button class="restart" type="button" (click)="control('restart')">{{ i18n.t('newGame') }}</button><button class="close" type="button" (click)="closed.emit()">{{ i18n.t('backToGames') }}</button></div>
  </div>
  <div class="game-shell">
    <div class="game-stage">
      <div #gameHost class="game-host" aria-label="Gra Tetris"></div>
      <div class="speed-controls" role="group" [attr.aria-label]="i18n.t('speed')">
        @for (option of speedOptions; track option) {
          <button type="button" [class.active]="speed() === option" [attr.aria-pressed]="speed() === option" (click)="setSpeed(option)">{{ option }}×</button>
        }
      </div>
      <div class="touch-controls" aria-label="Sterowanie grą">
        <div class="move-controls">
          <button type="button" (click)="control('left')" aria-label="W lewo">←</button>
          <button type="button" (click)="control('down')" aria-label="W dół">↓</button>
          <button type="button" (click)="control('right')" aria-label="W prawo">→</button>
        </div>
        <div class="action-controls">
          <button type="button" (click)="control('rotate')" aria-label="Obróć">↻</button>
          <button class="drop" type="button" (click)="control('drop')" aria-label="Upuść">DROP</button>
        </div>
        <button class="pause" type="button" (click)="control('pause')">{{ paused() ? '▶' : 'Ⅱ' }} {{ i18n.t(paused() ? 'resume' : 'pause') }}</button>
      </div>
    </div>
    <div class="mobile-game-actions"><button class="restart" type="button" (click)="control('restart')">{{ i18n.t('newGame') }}</button><button class="close" type="button" (click)="closed.emit()">{{ i18n.t('backToGames') }}</button></div>
  </div>
</section>
